kind = "mobile"
previewPath = "/mobile/"
title = "السوري معك - تطبيق الجوال"
version = "1.0.0"
id = "artifacts/alsouri-maak-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 21161

[services.development]
run = "pnpm --filter @workspace/alsouri-maak-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alsouri-maak-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/alsouri-maak-mobile", "run", "serve" ]

[services.env]
PORT = "21161"
BASE_PATH = "/mobile/"
